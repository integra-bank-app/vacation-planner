<header class="flex flex-row place-content-between p-4 border-b-2 border-b-primary">
  <div>
    <site-logo></site-logo>
  </div>
  @if (windowWidth > 800) {

    <div class="text-gray-500">
      <nav>
        <a routerLink="/trips" class="hover:underline" routerLinkActive="text-primary">My trips</a> |
        <a routerLink="/flights" class="hover:underline" routerLinkActive="text-primary">Flights</a> |
        <a routerLink="/accommodations" class="hover:underline" routerLinkActive="text-primary">Accommodations</a> |
        <a routerLink="/restaurants" class="hover:underline" routerLinkActive="text-primary">Restaurants</a>
      </nav>
    </div>
    <div class="w-40 flex place-content-end">
      <div>
        <user-menu></user-menu>
      </div>
    </div>
  } @else {
    <div>
      <mobile-drawer></mobile-drawer>
    </div>
  }
</header>
